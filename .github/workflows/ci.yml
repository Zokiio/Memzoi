name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace
      - name: Test repository-write safety boundary
        run: |
          cargo test -p memzoi-core --test repository_write_safety
          cargo test -p memzoi-core --test repository_write_route_parity
          scripts/check-repository-write-boundary.sh
      - name: Scan resulting repository memory blobs
        if: github.event_name == 'pull_request'
        run: >-
          cargo run --locked -p memzoi-cli -- safety scan
          --range "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          --json
      - name: Run recall and capture evaluations
        run: make eval
      - name: Run onboarding smoke test
        run: make onboarding-smoke
      - name: Run direct-binary capture smoke test
        run: make capture-smoke
      - name: Check old-name drift
        run: |
          ! grep -rIE 'agent[.]memory[.]lab|[.]ai-memory|ai[.]memory' \
            --exclude-dir=.git \
            --exclude-dir=.hermes \
            --exclude-dir=.research \
            --exclude-dir=target \
            --exclude-dir=node_modules \
            --exclude-dir=build \
            --exclude-dir=.docusaurus \
            .
      - name: Check release metadata
        run: scripts/check-release-metadata.sh
