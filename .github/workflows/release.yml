name: Build release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build; use main for a dry run or vX.Y.Z for upload"
        required: true
        default: "main"
      upload:
        description: "Upload assets to the matching GitHub release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      build_ref: ${{ steps.metadata.outputs.build_ref }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - name: Validate release metadata
        id: metadata
        shell: bash
        env:
          BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "Unable to read workspace version from Cargo.toml" >&2
            exit 1
          fi
          release_tag="v$version"
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" != "$release_tag" ]; then
            echo "Tag $REF_NAME does not match workspace version $release_tag" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$UPLOAD" = "true" ] && [ "$BUILD_REF" != "$release_tag" ]; then
            echo "Uploads require ref $release_tag; got $BUILD_REF" >&2
            exit 1
          fi
          scripts/check-release-metadata.sh "$release_tag"
          echo "build_ref=$BUILD_REF" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-26-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-26
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.build_ref }}
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Build binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p memzoi-cli -p memzoi-mcp
      - name: Package Unix binaries
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.preflight.outputs.release_tag }}"
          archive="memzoi-$tag-${{ matrix.target }}.tar.gz"
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/memzoi" dist/package/memzoi
          cp "target/${{ matrix.target }}/release/memzoi-mcp" dist/package/memzoi-mcp
          chmod +x dist/package/memzoi dist/package/memzoi-mcp
          tar -C dist/package -czf "dist/$archive" memzoi memzoi-mcp
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
      - name: Package Windows binaries
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ needs.preflight.outputs.release_tag }}"
          $archive = "memzoi-$tag-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/memzoi.exe" "dist/package/memzoi.exe"
          Copy-Item "target/${{ matrix.target }}/release/memzoi-mcp.exe" "dist/package/memzoi-mcp.exe"
          Compress-Archive -Path "dist/package/memzoi.exe", "dist/package/memzoi-mcp.exe" -DestinationPath "dist/$archive" -Force
          $hash = Get-FileHash "dist/$archive" -Algorithm SHA256
          $manifest = "$($hash.Hash.ToLower())  $archive`n"
          [System.IO.File]::WriteAllText(
            "dist/$archive.sha256",
            $manifest,
            [System.Text.UTF8Encoding]::new($false)
          )
      - name: Verify Unix packaged binary versions
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          ARCHIVE: dist/memzoi-${{ needs.preflight.outputs.release_tag }}-${{ matrix.target }}.tar.gz
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/memzoi-release-package"
          mkdir -p "$verify_dir"

          entries=$(tar -tzf "$ARCHIVE" | LC_ALL=C sort)
          expected_entries=$(printf '%s\n' memzoi memzoi-mcp)
          if [ "$entries" != "$expected_entries" ]; then
            printf 'Unexpected archive contents:\n%s\n' "$entries" >&2
            exit 1
          fi

          tar -xzf "$ARCHIVE" -C "$verify_dir"
          test -x "$verify_dir/memzoi"
          test -x "$verify_dir/memzoi-mcp"

          cli_version=$("$verify_dir/memzoi" --version)
          mcp_version=$("$verify_dir/memzoi-mcp" --version)
          if [ "$cli_version" != "memzoi $EXPECTED_VERSION" ]; then
            printf 'Unexpected CLI version: %s\n' "$cli_version" >&2
            exit 1
          fi
          if [ "$mcp_version" != "memzoi-mcp $EXPECTED_VERSION" ]; then
            printf 'Unexpected MCP version: %s\n' "$mcp_version" >&2
            exit 1
          fi

          printf 'CLI: %s\n' "$cli_version"
          printf 'MCP: %s\n' "$mcp_version"
      - name: Verify Windows packaged binary versions
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          ARCHIVE: dist/memzoi-${{ needs.preflight.outputs.release_tag }}-${{ matrix.target }}.zip
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $archive = (Resolve-Path $env:ARCHIVE).Path

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $entries = @($zip.Entries | ForEach-Object FullName | Sort-Object)
          } finally {
            $zip.Dispose()
          }
          $expectedEntries = @('memzoi-mcp.exe', 'memzoi.exe')
          $difference = Compare-Object -ReferenceObject $expectedEntries -DifferenceObject $entries
          if ($null -ne $difference) {
            throw "Unexpected archive contents: $($entries -join ', ')"
          }

          $verifyDir = Join-Path $env:RUNNER_TEMP 'memzoi-release-package'
          Expand-Archive -Path $archive -DestinationPath $verifyDir -Force
          $cli = Join-Path $verifyDir 'memzoi.exe'
          $mcp = Join-Path $verifyDir 'memzoi-mcp.exe'
          if (-not (Test-Path $cli -PathType Leaf)) { throw "Packaged CLI is missing" }
          if (-not (Test-Path $mcp -PathType Leaf)) { throw "Packaged MCP server is missing" }

          $cliVersion = (& $cli --version | Out-String).Trim()
          $cliExit = $LASTEXITCODE
          if ($cliExit -ne 0) { throw "Packaged CLI exited with $cliExit" }
          $mcpVersion = (& $mcp --version | Out-String).Trim()
          $mcpExit = $LASTEXITCODE
          if ($mcpExit -ne 0) { throw "Packaged MCP server exited with $mcpExit" }
          if ($cliVersion -ne "memzoi $env:EXPECTED_VERSION") {
            throw "Unexpected CLI version: $cliVersion"
          }
          if ($mcpVersion -ne "memzoi-mcp $env:EXPECTED_VERSION") {
            throw "Unexpected MCP version: $mcpVersion"
          }

          Write-Host "CLI: $cliVersion"
          Write-Host "MCP: $mcpVersion"
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: memzoi-${{ matrix.target }}
          path: dist/*

  upload:
    name: Upload release assets
    runs-on: ubuntu-latest
    needs: [preflight, build]
    if: github.event_name == 'push' || inputs.upload == true
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.preflight.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found in dist" >&2
            exit 1
          fi
          gh release upload "$TAG_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
