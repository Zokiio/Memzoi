name: Build release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-26-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-26
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Build binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p memzoi-cli -p memzoi-mcp
      - name: Package Unix binaries
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          fi
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/memzoi" dist/package/memzoi
          cp "target/${{ matrix.target }}/release/memzoi-mcp" dist/package/memzoi-mcp
          chmod +x dist/package/memzoi dist/package/memzoi-mcp
          tar -C dist/package -czf "dist/memzoi-$tag-${{ matrix.target }}.tar.gz" memzoi memzoi-mcp
          shasum -a 256 "dist/memzoi-$tag-${{ matrix.target }}.tar.gz" > "dist/memzoi-$tag-${{ matrix.target }}.tar.gz.sha256"
      - name: Package Windows binaries
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          }
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/memzoi.exe" "dist/package/memzoi.exe"
          Copy-Item "target/${{ matrix.target }}/release/memzoi-mcp.exe" "dist/package/memzoi-mcp.exe"
          Compress-Archive -Path "dist/package/memzoi.exe", "dist/package/memzoi-mcp.exe" -DestinationPath "dist/memzoi-$tag-${{ matrix.target }}.zip" -Force
          $hash = Get-FileHash "dist/memzoi-$tag-${{ matrix.target }}.zip" -Algorithm SHA256
          "$($hash.Hash.ToLower())  memzoi-$tag-${{ matrix.target }}.zip" | Set-Content "dist/memzoi-$tag-${{ matrix.target }}.zip.sha256"
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: memzoi-${{ matrix.target }}
          path: dist/*

  upload:
    name: Upload release assets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found in dist" >&2
            exit 1
          fi
          gh release upload "$TAG_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
