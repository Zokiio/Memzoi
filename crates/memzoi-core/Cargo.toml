[package]
name = "memzoi-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "File-native AI memory core library with SQLite storage, search, and proposal workflows."
keywords = ["ai", "agents", "memory", "sqlite", "search"]
categories = ["development-tools"]

[features]
default = []
recall-models = ["dep:fastembed"]

[dependencies]
anyhow.workspace = true
blake3.workspace = true
fastembed = { workspace = true, optional = true }
ignore.workspace = true
rusqlite.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
serde_yaml = "0.9.34"
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
toml.workspace = true
uuid.workspace = true
url.workspace = true

[build-dependencies]
blake3.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "memory_bench"
harness = false
