[workspace]
members = [
  "crates/memzoi-core",
  "crates/memzoi-cli",
  "crates/memzoi-mcp",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.96.1"
version = "0.3.1"
license = "MIT"
repository = "https://github.com/Zokiio/Memzoi"
homepage = "https://zokiio.github.io/Memzoi/"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
predicates = "3"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
toml = "1"
ureq = "2"
uuid = { version = "1", features = ["v7", "serde"] }
