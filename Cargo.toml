[workspace]
members = [
  "crates/memzoi-core",
  "crates/memzoi-cli",
  "crates/memzoi-mcp",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
predicates = "3"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
toml = "1"
uuid = { version = "1", features = ["v7", "serde"] }
