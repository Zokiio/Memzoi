        relevance: 0
        eligible: true
        hard_negative: true
        rationale: Valid but irrelevant memory.
      - record_id: scope-distractor
        relevance: 0
        eligible: false
        forbidden_reason: scope
        rationale: Team beta is outside repo scope.
      - record_id: semantic-target
        relevance: 0
        eligible: true
        hard_negative: true
        rationale: Valid but irrelevant memory.
