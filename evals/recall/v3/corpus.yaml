    query: quartz lexical sentinel
    slices: [exact_terminology, lexical]
    provenance:
      kind: human_written
      reference: issue://73/exact-terminology
    scope_kind: repo
    top_k: 2
    context_budget: 500
    judgments:
      - record_id: lexical-target
        relevance: 3
        eligible: true
        expected_citations: [fixture://lexical-target]
        rationale: Exact title and body match.
      - record_id: scope-distractor
        relevance: 0
        eligible: false
        forbidden_reason: scope
        rationale: Team beta is outside repo scope.
      - record_id: citation-target
        relevance: 0
        eligible: true
        hard_negative: true
        rationale: Valid but irrelevant memory.
      - record_id: semantic-target
        relevance: 0
        eligible: true
        hard_negative: true
        rationale: Valid but irrelevant memory.
  - id: citation-and-path
    query: indigo citation sentinel
