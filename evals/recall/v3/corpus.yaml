version: memzoi-recall-corpus/v3
name: recall-v3-development-smoke
kind: development
evaluated_at: 2026-07-10T12:00:00Z
records_root: records
records:
  - citation-target.md
  - lexical-target.md
  - semantic-target.md
  - scope-distractor.md
thresholds:
  min_mean_ndcg_at_10: 0.66
  min_mean_recall_at_k: 0.66
  min_mean_mrr: 0.66
  max_forbidden_hits: 0
  min_citation_integrity: 1.0
  min_fallback_parity: 1.0
cases:
