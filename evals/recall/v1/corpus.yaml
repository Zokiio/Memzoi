version: memzoi-recall-corpus/v1
name: memzoi-lexical-recall-v1
evaluated_at: 2026-07-10T12:00:00Z
records_root: records
records:
  - citation-target.md
  - lane-distractor.md
  - lane-target.md
  - lexical-target.md
  - path-distractor.md
  - path-target.md
  - scope-distractor.md
  - scope-target.md
  - stale-active.md
  - stale-obsolete.md
thresholds:
  min_mean_recall_at_k: 1.0
  min_mean_mrr: 1.0
  max_forbidden_hits: 0
cases:
  - id: lexical-title-and-body
    query: quartz lexical sentinel
    relevant_ids: [lexical-target]
    forbidden_ids: []
    scope_kind: repo
    type: fact
    lane: semantic
    k: 3
  - id: path-filter-before-limit
    query: cerulean path sentinel
    relevant_ids: [path-target]
    forbidden_ids: [path-distractor]
    scope_kind: repo
    type: decision
    lane: semantic
    path: crates/memzoi-core/src/search.rs
    k: 1
  - id: scope-filter-before-limit
    query: amber scope sentinel
    relevant_ids: [scope-target]
    forbidden_ids: [scope-distractor]
    scope_kind: team
    scope_id: team-alpha
    type: procedure
    lane: procedural
    k: 1
  - id: lane-filter-before-limit
    query: verdant lane sentinel
    relevant_ids: [lane-target]
    forbidden_ids: [lane-distractor]
    scope_kind: repo
    type: procedure
    lane: procedural
    k: 1
  - id: stale-status-suppression
    query: crimson lifecycle sentinel
    relevant_ids: [stale-active]
    forbidden_ids: [stale-obsolete]
    scope_kind: repo
    type: warning
    lane: semantic
    k: 3
  - id: citation-round-trip
    query: indigo evidence sentinel
    relevant_ids: [citation-target]
    forbidden_ids: []
    scope_kind: repo
    type: decision
    lane: semantic
    path: docs/roadmap.md
    k: 3
